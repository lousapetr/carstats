[project]
name = "carstats-backend"
version = "0.1.0"
description = "Personal car logging app backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "alembic>=1.14",
    "authlib>=1.3.2",
    "httpx>=0.27",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) is idiomatically used as an argument default.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
